server {
    listen %%interface%%:%%port%% default_server;

    client_max_body_size 0;

    # Keep redirects relative. nginx otherwise re-absolutizes the proxy_redirect
    # rewrites below to its own internal listen address (e.g.
    # http://172.30.x.x:PORT/...), which the browser can't reach behind ingress.
    absolute_redirect off;

    # Bare ingress root -> the app's webroot. Relative redirect so it resolves
    # under HA's per-session ingress token path, whether HA forwards "/" or
    # "/lazylibrarian".
    location = / {
        return 302 lazylibrarian/;
    }

    location / {
        proxy_pass http://127.0.0.1:5299;
        proxy_connect_timeout 30m;
        proxy_send_timeout 30m;
        proxy_read_timeout 30m;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HA ingress strips its "/api/hassio_ingress/<token>" prefix before
        # forwarding and passes it back to us in the X-Ingress-Path header.
        # LazyLibrarian is unaware of that prefix and emits absolute redirects
        # and "/lazylibrarian/..." links, so we re-inject the prefix here.

        # Rewrite upstream redirect (Location header) values, whether they come
        # back host-absolute (http://host/lazylibrarian/...) or root-relative
        # (/lazylibrarian/...). With absolute_redirect off these stay relative.
        # When X-Ingress-Path is empty (direct access) this collapses to a plain
        # "/lazylibrarian/..." path.
        proxy_redirect ~*^https?://[^/]+(/lazylibrarian.*)$ $http_x_ingress_path$1;
        proxy_redirect ~*^(/lazylibrarian.*)$ $http_x_ingress_path$1;

        # Rewrite root-absolute links in the body so assets/links stay under the
        # ingress prefix. Disabling Accept-Encoding lets nginx see plain text.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types *;
        sub_filter "/lazylibrarian" "$http_x_ingress_path/lazylibrarian";
    }
}

name: Test Docker build

on: [pull_request]

jobs:
  dockerlint:
    name: Dockerfile linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint < lazylibrarian/Dockerfile

  build-amd64:
    name: Build amd64 image
    runs-on: ubuntu-latest
    needs: [dockerlint]
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        uses: onlyutkarsh/patch-files-action@v1.0.7
        with:
          files: |
            lazylibrarian/config.json
          patch-syntax: |
            = /version => "${{ github.run_number }}"
      - name: build amd64 image
        run: docker run --rm --privileged -v /var/run/docker.sock:/var/run/docker.sock -v ~/.docker:/root/.docker -v "$(pwd)":/data homeassistant/amd64-builder -t lazylibrarian --amd64 --test

  build-aarch64:
    name: Build aarch64 image
    runs-on: ubuntu-latest
    needs: [dockerlint]
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        uses: onlyutkarsh/patch-files-action@v1.0.7
        with:
          files: |
            lazylibrarian/config.json
          patch-syntax: |
            = /version => "${{ github.run_number }}"
      - name: build aarch64 image
        run: docker run --rm --privileged -v /var/run/docker.sock:/var/run/docker.sock -v ~/.docker:/root/.docker -v "$(pwd)":/data homeassistant/amd64-builder -t lazylibrarian --aarch64 --test
